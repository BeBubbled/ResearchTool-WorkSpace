<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全局设置 · 科研工具箱</title>
  {% include "_theme_head.html" %}
  <link rel="stylesheet" href="/static/styles.css?v=20261109-uiink2">
  <link rel="stylesheet" href="/static/paper_revision_workflow.css?v=20261109-uiink">
  <link rel="stylesheet" href="/static/settings_page.css?v=20261109-uiink">
</head>
<body class="settings-page{% if embed %} settings-embedded{% endif %}">
  {% if not embed %}{% set client_active = "settings" %}{% include "_client_nav.html" %}{% endif %}
  {% if not embed %}<header class="module-bar"><h1 class="module-bar-title">设置</h1><span class="module-bar-sub">AI 引擎、OCR、翻译、语音与 GitHub · 精读、改稿、Prompt 与工具箱共用</span><div class="module-bar-actions"><span class="module-bar-pill">本机全局</span></div></header>{% endif %}
  <main class="settings-main">
    <div id="settingsRoot" class="tool-form settings-root"></div>
  </main>
  <script src="/static/engine_picker.js?v=2"></script>
  <script src="/static/paper_revision_workflow.js?v=2"></script>
  <script src="/static/settings.js?v=11"></script>
  <script>
    (() => {
      const embedded = {{ "true" if embed else "false" }};
      // No hash → settings.js reopens the last pane (stored per browser).
      const tabFromHash = () => decodeURIComponent(location.hash.replace(/^#(settings\/)?/, ""));
      const notifyParent = type => { if (embedded && window.parent !== window) window.parent.postMessage({ type }, location.origin); };
      window.GlobalSettings.mount(document.querySelector("#settingsRoot"), {
        tab: tabFromHash(),
        onTabChange: tab => history.replaceState(null, "", `${location.pathname}${location.search}#${tab}`),
        onSaved: () => notifyParent("research-settings-saved"),
        onChanged: () => notifyParent("research-settings-saved"),
      });
      // In the settings window, Esc closes it (the search box and pickers handle their own Esc first).
      if (embedded) document.addEventListener("keydown", event => {
        if (event.key === "Escape" && !event.defaultPrevented && !document.querySelector(".theme-picker:not([hidden])")) notifyParent("research-settings-close");
      });
      window.addEventListener("hashchange", () => window.GlobalSettings.activate(tabFromHash()));
      window.addEventListener("message", event => {
        if (event.origin === location.origin && event.source === window.parent && event.data?.type === "research-settings-tab") window.GlobalSettings.activate(event.data.tab);
      });
    })();
  </script>
</body>
</html>
