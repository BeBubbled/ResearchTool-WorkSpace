<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文献库 · 科研工具箱</title>
  <meta name="theme-color" content="#182a5b">
  <link rel="stylesheet" href="/static/styles.css?v=20261108-toolbox">
  <link rel="stylesheet" href="/static/library.css?v=5">
</head>
<body class="library-page">
  {% set client_active = "library" %}{% include "_client_nav.html" %}
  <header class="module-bar"><h1 class="module-bar-title">文献库</h1><span class="module-bar-sub">精读打开过的论文按内容识别、只存一份；研究空白与 Studio 直接取用</span><div class="module-bar-actions"><a class="button secondary" href="/reader">＋ 在精读中导入</a></div></header>
  <main class="library-main">
    <div class="library-toolbar">
      <label class="sr-only" for="librarySearch">搜索文献</label>
      <input id="librarySearch" type="search" placeholder="搜索标题或文件名">
      <label class="library-filter"><input id="libraryPdfOnly" type="checkbox"> 只看有原始 PDF 的</label>
      <span id="libraryCount" class="hint" role="status" aria-live="polite"></span>
    </div>
    <div id="libraryList" class="library-list" aria-live="polite"><p class="hint">正在读取文献库…</p></div>
  </main>
  <script src="/static/library.js?v=2" defer></script>
</body>
</html>
