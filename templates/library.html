<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文献库 · 科研工具箱</title>
  {% include "_theme_head.html" %}
  <link rel="stylesheet" href="/static/styles.css?v=20261109-uiink2">
  <link rel="stylesheet" href="/static/library.css?v=20261109-uiink">
</head>
<body class="library-page">
  {% set client_active = "library" %}{% include "_client_nav.html" %}
  <header class="module-bar"><h1 class="module-bar-title">文献库</h1><span class="module-bar-sub">精读打开过的论文按内容识别、只存一份；研究空白与 Studio 直接取用</span><div class="module-bar-actions"><button id="libraryInspectorToggle" type="button" class="button secondary" aria-controls="libraryInspector" data-command="显示 / 隐藏详情" data-shortcut="mod+alt+\">详情 ⊟</button><a class="button secondary" href="/reader" data-command="在精读中导入新论文">＋ 在精读中导入</a></div></header>
  <main id="libraryLayout" class="library-shell">
    <nav class="library-sources" aria-label="文献来源">
      <label class="sr-only" for="librarySearch">搜索文献</label>
      <input id="librarySearch" type="search" placeholder="搜索标题或文件名" autocomplete="off" data-command="搜索文献库" data-shortcut="/">
      <div id="librarySourceList" class="library-source-list" role="listbox" aria-label="来源"></div>
    </nav>
    <section class="library-table-wrap" aria-label="论文列表">
      <div class="library-toolbar"><strong id="librarySourceTitle">全部论文</strong><span id="libraryCount" class="hint" role="status" aria-live="polite"></span><span class="hint library-tip">双击打开精读 · 空格勾选 · 右键更多操作</span></div>
      <div id="libraryBatchBar" class="library-batch-bar" role="toolbar" aria-label="批量操作" hidden>
        <strong id="libraryBatchCount">已选 0 篇</strong>
        <label class="library-batch-project"><span class="sr-only">研究项目</span><select id="libraryBatchProject"><option value="">读取研究项目…</option></select></label>
        <button id="libraryBatchAdd" type="button" class="button secondary" data-command="批量：加入研究项目">加入研究项目</button>
        <button id="libraryBatchThreePass" type="button" class="button secondary" data-command="批量：排队 Three-Pass（Codex）">Three-Pass（Codex）</button>
        <button id="libraryBatchCopyBib" type="button" class="button secondary" data-command="批量：复制 BibTeX">复制 BibTeX</button>
        <button id="libraryBatchExportBib" type="button" class="button secondary" data-command="批量：导出 .bib">导出 .bib</button>
        <button id="libraryBatchClear" type="button" class="button quiet" data-command="取消选择">取消选择</button>
        <span id="libraryBatchStatus" class="hint library-batch-status" role="status" aria-live="polite"></span>
      </div>
      <div id="libraryList" class="library-list" aria-live="polite"><p class="hint">正在读取文献库…</p></div>
    </section>
    <aside id="libraryInspector" class="library-inspector" aria-label="论文详情" aria-live="polite">
      <p class="hint">选择一篇论文查看文件、笔记、Three-Pass、研究项目与成果。</p>
    </aside>
  </main>
  <script src="/static/inspector.js?v=1"></script>
  <script src="/static/library.js?v=4" defer></script>
</body>
</html>
